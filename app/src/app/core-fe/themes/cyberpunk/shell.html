<div class="shell shell-cyberpunk">
  <header class="shell-heading">
    <div class="cyber-topbar">
      <core-fe-shell-slot [slot]="slots.TopbarStart" /><ng-content select="[shell-heading]" />
    </div>
    <aside class="cyber-tools" aria-label="Optional tools">
      <core-fe-shell-slot [slot]="slots.TopbarActions" />
      <core-fe-shell-slot [slot]="slots.FloatingActions" />
    </aside>
  </header>
  <div class="cyber-workspace">
    <aside class="shell-navigation">
      <core-fe-shell-slot [slot]="slots.NavigationBefore" /><core-fe-navigation-outlet
        [items]="navigation()"
      /><core-fe-shell-slot [slot]="slots.NavigationAfter" />
    </aside>
    <main>
      <core-fe-shell-slot [slot]="slots.ContextualActions" /><core-fe-shell-slot
        [slot]="slots.ContentBefore"
      />
      <core-fe-panel-outlet><ng-content select="[shell-content]" /></core-fe-panel-outlet
      ><core-fe-shell-slot [slot]="slots.ContentAfter" />
    </main>
  </div>
  <footer>
    <ng-content select="[shell-footer]" /><core-fe-shell-slot [slot]="slots.Footer" />
  </footer>
</div>
